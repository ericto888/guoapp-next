name: Format Dart files

on:
  push:
    branches:
      - fix/hongguo-find-module-separation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ github.token }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
