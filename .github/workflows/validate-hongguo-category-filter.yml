name: Validate Hongguo category filter bridge

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/hongguo-category-filter-app
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hongguo-category-filter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Format category filter files
        run: dart format lib/category_filter_models.dart lib/core_bridge.dart lib/ui/find/find_drama_page.dart lib/ui/shell/app_shell.dart
      - name: Commit category filter formatting
        run: |
          if ! git diff --quiet -- lib/category_filter_models.dart lib/core_bridge.dart lib/ui/find/find_drama_page.dart lib/ui/shell/app_shell.dart; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/category_filter_models.dart lib/core_bridge.dart lib/ui/find/find_drama_page.dart lib/ui/shell/app_shell.dart
            git commit -m 'style(hongguo): format category filter integration'
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          fi
      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed lib/category_filter_models.dart lib/core_bridge.dart lib/ui/find/find_drama_page.dart lib/ui/shell/app_shell.dart
      - name: Dart analyzer
        run: dart analyze --fatal-infos lib test
      - name: Flutter tests
        run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Go tests
        working-directory: native
        run: go test -race ./...
