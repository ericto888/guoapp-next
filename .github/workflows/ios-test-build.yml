name: iOS device-test IPA

on:
  push:
    branches:
      - fix/playback-standby-lifecycle-503
    paths:
      - '.github/workflows/ios-test-build.yml'
      - 'lib/**'
      - 'native/**'
      - 'ios/**'
      - 'scripts/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'bundled-modules/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-device-test-${{ github.ref }}
  cancel-in-progress: false

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  BUNDLED_MODULES: bundled-modules/hongguo
  PYTHONUTF8: '1'

jobs:
  build-ios-unsigned:
    name: Build unsigned iOS IPA for device testing
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4

      - name: Checkout Hongguo module
        uses: actions/checkout@v4
        with:
          repository: guoapp-modules/hongguo
          path: bundled-modules/hongguo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Check Apple build tools
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --find clang
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
          go version
          flutter --version
          flutter precache --ios

      - name: Build and validate unsigned IPA
        run: python scripts/build_ios.py

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: guoapp-next-ios-test-${{ github.run_number }}
          path: dist/ios/*-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
