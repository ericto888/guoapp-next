name: Test iOS IPA (migration branch)

on:
  push:
    branches:
      - upstream/xanerix-ios-stream-recovery

permissions:
  contents: read

concurrency:
  group: ios-migration-test-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  BUNDLED_MODULES: bundled-modules/hongguo
  PYTHONUTF8: '1'

jobs:
  ios-unsigned:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: guoapp-modules/hongguo
          path: bundled-modules/hongguo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Prepare iOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          if ! command -v pod >/dev/null 2>&1; then brew install cocoapods; fi
          pod --version
          go version
          flutter --version
          flutter precache --ios
      - name: Test native Go core
        working-directory: native
        run: go test ./...
      - name: Build unsigned iOS IPA
        run: python scripts/build_ios.py
      - uses: actions/upload-artifact@v4
        with:
          name: ios-migration-unsigned
          path: dist/ios/*.ipa
          if-no-files-found: error
          retention-days: 14

  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: guoapp-modules/hongguo
          path: bundled-modules/hongguo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Prepare Android toolchain
        run: |
          flutter --version
          flutter doctor -v
          go version
      - name: Build Android arm64 APK
        run: python scripts/build_android.py --abi arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-migration-test
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
