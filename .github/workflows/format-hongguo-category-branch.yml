name: One-time Dart formatting for Hongguo category branch

on:
  push:
    branches:
      - feature/hongguo-category-filter-bridge

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hongguo-category-filter-bridge
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - name: Format Dart sources
        run: dart format lib test
      - name: Commit formatting changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test
            git commit -m "style: format Dart sources for category filter"
            git push origin HEAD:feature/hongguo-category-filter-bridge
          else
            echo "No formatting changes."
          fi
