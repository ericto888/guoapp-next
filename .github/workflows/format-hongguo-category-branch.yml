name: One-time changed Dart file formatting

on:
  push:
    branches:
      - feature/hongguo-category-filter-bridge

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hongguo-category-filter-bridge
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format changed Dart files
        run: dart format lib/category_filter_models.dart lib/core_bridge.dart lib/danmaku_controller.dart lib/local_store.dart lib/source_modules.dart lib/ui/find/find_drama_page.dart lib/ui/player/portrait_player_page.dart lib/ui/settings/appearance_settings.dart lib/ui/shell/app_shell.dart test/category_filter_models_test.dart
      - name: Commit formatting changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/category_filter_models.dart lib/core_bridge.dart lib/danmaku_controller.dart lib/local_store.dart lib/source_modules.dart lib/ui/find/find_drama_page.dart lib/ui/player/portrait_player_page.dart lib/ui/settings/appearance_settings.dart lib/ui/shell/app_shell.dart test/category_filter_models_test.dart
            git commit -m "style: format Hongguo category integration"
            git push origin HEAD:feature/hongguo-category-filter-bridge
          else
            echo "No formatting changes."
          fi
